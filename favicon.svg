<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1f0a" />
      <stop offset="100%" stop-color="#0e0a05" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffea79" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="#ffa751" stroke-width="2" />
  <circle cx="32" cy="32" r="26" fill="none" stroke="#ffe259" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.6" />

  <!-- Lightning Bolt -->
  <polygon points="34,4 18,34 30,34 22,60 48,26 36,26 48,4" fill="url(#boltGrad)" filter="url(#glow)" />

  <!-- Stylized Fist Center Overlay -->
  <path d="M25,24 C23,24 21,26 21,29 L21,41 C21,46 25,50 31,50 L34,50 C39,50 43,46 43,41 L43,30 C43,28 41,26 39,26 C38,26 37,27 36,28 C35.5,26.8 34,26 32.5,26 C31.5,26 30.5,26.5 30,27.5 C29,25.5 27,24 25,24 Z" fill="url(#goldGrad)" stroke="#1a0f00" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Fist knuckles accents -->
  <path d="M26,30 L26,37 M31,29 L31,37 M36,29 L36,37 M40,31 L40,38" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.8" />
</svg>
